<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2 id="modalTitle">Nuevo movimiento</h2><button class="xbtn" id="modalClose">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></section></div><div class="toast" id="toast"></div>
<script src="./auth-config.js"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const KEY='gastoslab-data-v1', BACKUP_KEY='gastoslab-daily-backups-v1';
const defaultCategories=[['Comida','🛒'],['Restaurantes','🍽️'],['Transporte','🚗'],['Hogar','🏠'],['Compras','🛍️'],['Salud','💊'],['Deporte','🏋️'],['Ocio','🎭'],['Viajes','✈️'],['Suscripciones','📱'],['Suministros','💡'],['Educación','📚'],['Otros','📦']];
let categories=structuredClone(defaultCategories);
const categoryIcons=['🛒','🍽️','🚗','🏠','🛍️','💊','🏋️','🎭','✈️','📱','💡','📚','🚬','💻','🐾','🎮','☕','🎁','💄','🧾','📦','🚲','🏥','🎵','⚽','🧳','🪴','🔧','💳','🏦'];
const accountDefaults=[{id:'main',name:'Principal',kind:'current',balance:0,visible:true},{id:'savings',name:'Ahorros',kind:'savings',balance:0,visible:false},{id:'investments',name:'Inversiones',kind:'investment',balance:0,visible:false}];
const blank=()=>({version:2,transactions:[],accounts:structuredClone(accountDefaults),recurring:[],budgets:[],goals:[],settings:{privacy:false,currency:'EUR',openingDate:new Date().toISOString().slice(0,10),setupComplete:false},updated:new Date().toISOString()});
function demoData(){const d=blank(),now=new Date(),ym=(offset)=>{const x=new Date(now.getFullYear(),now.getMonth()+offset,12);return x.toISOString().slice(0,10)};d.settings.demo=true;d.settings.setupComplete=true;d.accounts[0].balance=1250;d.accounts[1].balance=8200;d.accounts[2].balance=3600;const add=(type,amount,date,merchant,category,accountId='main',extra={})=>d.transactions.push({id:uid(),type,amount,date,merchant,category,accountId,method:extra.method||'',description:extra.description||'',sample:true,...extra});
add('income',2150,ym(-2),'Sueldo','Sueldo');add('expense',62.4,ym(-2),'Supermercado','Comida');add('expense',38,ym(-2),'Restaurante','Restaurantes');add('expense',42,ym(-2),'Combustible','Transporte');add('income',2150,ym(-1),'Sueldo','Sueldo');add('expense',74.8,ym(-1),'Supermercado','Comida');add('expense',29.5,ym(-1),'Gimnasio','Deporte');add('expense',55,ym(-1),'Electricidad','Suministros');add('income',2150,ym(0),'Sueldo','Sueldo');add('expense',48.2,ym(0),'Supermercado','Comida');add('expense',32,ym(0),'Restaurante','Restaurantes');add('expense',18.9,ym(0),'Transporte','Transporte');d.recurring=[{id:uid(),name:'Gimnasio',amount:35,type:'expense',frequency:'Mensual',category:'Deporte',nextDate:ym(0),sample:true},{id:uid(),name:'Sueldo',amount:2150,type:'income',frequency:'Mensual',category:'Sueldo',nextDate:ym(0),sample:true}];d.budgets=[{id:uid(),category:'Comida',limit:250,sample:true},{id:uid(),category:'Restaurantes',limit:100,sample:true},{id:uid(),category:'Ocio',limit:80,sample:true}];d.goals=[{id:uid(),name:'Fondo de emergencia',target:10000,saved:3500,deadline:'2027-12-31',sample:true}];return d}
let data=load(),page='home',filterText='',filterMonth='',filterType='',editingId=null,selectedCategory='Comida',toastTimer=null;
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&[1,2].includes(raw.version)){const d=raw;d.version=2;d.accounts=d.accounts||structuredClone(accountDefaults);d.transactions=d.transactions||[];d.recurring=d.recurring||[];d.budgets=d.budgets||[];d.goals=d.goals||[];d.settings=d.settings||{};if(Array.isArray(d.settings.categories)&&d.settings.categories.length)d.settings.categories=d.settings.categories.filter(c=>Array.isArray(c)&&c[0]&&c[1]);else d.settings.categories=structuredClone(defaultCategories);categories=structuredClone(d.settings.categories);d.accounts=d.accounts.map(a=>({...a,id:({bbva:'main',myinvestor:'savings'}[a.id]||a.id),name:({bbva:'Principal',myinvestor:'Ahorros'}[a.id]||a.name)}));d.accounts=accountDefaults.map(def=>({...def,...(d.accounts.find(a=>a.id===def.id)||{})}));d.transactions.forEach(t=>{if(t.accountId==='bbva')t.accountId='main';if(t.accountId==='myinvestor')t.accountId='savings';if(t.toAccountId==='bbva')t.toAccountId='main';if(t.toAccountId==='myinvestor')t.toAccountId='savings';if(t.method==='Tarjeta BBVA')t.method='Tarjeta'});d.settings.setupComplete=d.settings.setupComplete??true;return d}}catch(e){}return demoData()}
function save(){data.settings=data.settings||{};data.settings.categories=structuredClone(categories);data.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data))}
if(!localStorage.getItem(KEY))save();

function uid(){return 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(n){if(data.settings.privacy)return '••••••';return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0)}
function num(n){return Number(n)||0}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateFmt(d){if(!d)return '—';return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'})}
function monthKey(d){return (d||'').slice(0,7)}function currentMonth(){return new Date().toISOString().slice(0,7)}function monthLabel(m){if(!m)return '';const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'})}
function account(id){return data.accounts.find(a=>a.id===id)||data.accounts[0]}
function catIcon(c){return (categories.find(x=>x[0]===c)||['Otros','📦'])[1]}
function txSigned(t){if(t.type==='income'||t.type==='refund')return num(t.amount);if(t.type==='expense')return -num(t.amount);return 0}
function accountBalance(id){const a=account(id);let b=num(a.balance);data.transactions.forEach(t=>{if(t.type==='transfer'){if(t.accountId===id)b-=num(t.amount);if(t.toAccountId===id)b+=num(t.amount)}else if(t.accountId===id)b+=txSigned(t)});return b}
function allExpenses(list=data.transactions){return list.filter(t=>t.type==='expense')}
function monthTx(m,accountId=null){return data.transactions.filter(t=>monthKey(t.date)===m&&(!accountId||t.accountId===accountId))}
function totals(list){return {income:list.filter(t=>t.type==='income').reduce((s,t)=>s+num(t.amount),0),expense:list.filter(t=>t.type==='expense').reduce((s,t)=>s+num(t.amount),0)}}
function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function titleFor(p){return ({home:'Inicio',transactions:'Movimientos',recurring:'Recurrentes',analytics:'Estadísticas',budgets:'Presupuestos',goals:'Objetivos',wealth:'Patrimonio',insights:'Análisis',settings:'Configuración'})[p]||'Inicio'}
function setPage(p){page=p;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#topTitle').textContent=titleFor(p);render()}
function head(title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">GastosLAB · Finanzas personales</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function cardHead(t,sub='',right=''){return `<div class="card-head"><div><h3>${t}</h3>${sub?`<p>${sub}</p>`:''}</div>${right}</div>`}
function txRow(t){const income=t.type==='income',transfer=t.type==='transfer',refund=t.type==='refund';let sign=income?'+':transfer?'↔':refund?'+':'−';let cls=income||refund?'positive':transfer?'':'negative';let label=transfer?`${account(t.accountId).name} → ${account(t.toAccountId).name}`:t.merchant||t.category;return `<tr><td><div class="tx-main"><div class="tx-icon">${transfer?'↔':catIcon(t.category)}</div><div><div class="tx-title">${esc(label)}</div><div class="tx-sub">${esc(t.category|| (income?'Ingreso':transfer?'Transferencia':'Reembolso'))} · ${dateFmt(t.date)}</div></div></div></td><td>${esc(account(t.accountId).name)}</td><td><span class="pill ${income||refund?'green':transfer?'blue':'red'}">${income?'Ingreso':transfer?'Transferencia':refund?'Reembolso':'Gasto'}</span></td><td class="amount ${cls}">${sign}${money(t.amount)}</td><td><button class="btn small" data-edit-tx="${t.id}">Editar</button></td></tr>`}
function txTable(list){if(!list.length)return `<div class="empty"><div class="big">🧾</div><b>Aún no hay movimientos</b><p>Registra tu primer gasto o ingreso para empezar a ver tus estadísticas.</p><button class="btn primary" data-action="add-expense">＋ Añadir movimiento</button></div>`;return `<div class="table-wrap"><table><thead><tr><th>Movimiento</th><th>Cuenta</th><th>Tipo</th><th>Importe</th><th></th></tr></thead><tbody>${list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(txRow).join('')}</tbody></table></div>`}
function lineChart(list,accountId=null){const months=[];const now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.toISOString().slice(0,7))}const vals=months.map(m=>{const t=totals(monthTx(m,accountId));return {...t,label:new Date(+m.slice(0,4),+m.slice(5)-1,1).toLocaleDateString('es-ES',{month:'short'})}});const max=Math.max(100,...vals.flatMap(v=>[v.income,v.expense]))*1.15;const W=600,H=220,L=42,R=12,T=12,B=30;const x=i=>L+i*(W-L-R)/5,y=v=>T+(H-T-B)*(1-v/max);let grid='';for(let i=0;i<4;i++){let yy=T+i*(H-T-B)/3;grid+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#edf2f7"/><text x="${L-8}" y="${yy+4}" text-anchor="end" fill="#93a2b3" font-size="10">${Math.round(max*(1-i/3)/100)*100}</text>`}const path=k=>vals.map((v,i)=>(i?'L':'M')+x(i)+','+y(v[k])).join(' ');let labels=vals.map((v,i)=>`<text x="${x(i)}" y="${H-7}" text-anchor="middle" fill="#8191a4" font-size="11">${v.label}</text>`).join('');let dots=['income','expense'].map((k,j)=>vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v[k])}" r="3.5" fill="${j?'#d46b75':'#4388c5'}"/>`).join('')).join('');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos seis meses">${grid}<path d="${path('income')}" fill="none" stroke="#4388c5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="${path('expense')}" fill="none" stroke="#d46b75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg>`}
function categoryDonut(list){const sums={};allExpenses(list).forEach(t=>sums[t.category||'Otros']=(sums[t.category||'Otros']||0)+num(t.amount));const entries=Object.entries(sums).sort((a,b)=>b[1]-a[1]).slice(0,5);const total=entries.reduce((s,x)=>s+x[1],0);const colors=['#2463a6','#5794cf','#91bde5','#b8d3ee','#d5e5f5'];let offset=0,circles=entries.map(([name,val],i)=>{const len=total?val/total*276:0;const el=`<circle cx="60" cy="60" r="44" fill="none" stroke="${colors[i]}" stroke-width="15" stroke-dasharray="${len} ${276-len}" stroke-dashoffset="${-offset}"/>`;offset+=len;return el}).join('');return `<div class="category-layout"><div class="donut"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="44" fill="none" stroke="#edf2f7" stroke-width="15"/>${circles}</svg><div class="donut-center"><b>${money(total)}</b><span>Gastos</span></div></div><div class="cat-legend">${entries.length?entries.map(([n,v],i)=>`<div class="cat-row"><div class="cat-label"><i class="dot" style="background:${colors[i]}"></i><span>${catIcon(n)} ${esc(n)}</span></div><b>${total?Math.round(v/total*100):0}%</b></div>`).join(''):'<span class="muted" style="font-size:11px">Aún no hay gastos clasificados.</span>'}</div></div>`}
function renderHome(){const m=currentMonth(),t=totals(monthTx(m,'main')),balance=accountBalance('main'),recent=data.transactions.filter(x=>x.accountId==='main'||x.toAccountId==='main').slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `${data.settings.demo?'<div class="note" style="margin-bottom:16px">🧪 <b>Estás viendo datos de ejemplo.</b> En Configuración puedes borrarlos y configurar los saldos reales de tus cuentas.</div>':''}${head('Tu dinero, bajo control','Resumen de tu cuenta principal',`<button class="btn primary" data-action="add-expense">＋ Nuevo movimiento</button>`)}<div class="grid stats-grid"><div class="card stat-card"><div class="stat-top">Saldo principal <span class="stat-icon">▣</span></div><div class="stat-value private">${money(balance)}</div><div class="stat-foot">Saldo calculado de la cuenta principal</div></div><div class="card stat-card"><div class="stat-top">Ingresos del mes <span class="stat-icon">↗</span></div><div class="stat-value positive private">${money(t.income)}</div><div class="stat-foot">${monthLabel(m)}</div></div><div class="card stat-card"><div class="stat-top">Gastos del mes <span class="stat-icon">↘</span></div><div class="stat-value negative private">${money(t.expense)}</div><div class="stat-foot">${monthLabel(m)}</div></div><div class="card stat-card"><div class="stat-top">Ahorro del mes <span class="stat-icon">✧</span></div><div class="stat-value private ${t.income-t.expense>=0?'positive':'negative'}">${money(t.income-t.expense)}</div><div class="stat-foot">Ingresos menos gastos registrados</div></div></div><div class="grid dash-grid"><section class="card">${cardHead('Evolución de ingresos y gastos','Últimos seis meses')}<div class="chart-wrap">${lineChart(null,'main')}</div><div class="legend"><span><i class="dot" style="background:#4388c5"></i>Ingresos</span><span><i class="dot" style="background:#d46b75"></i>Gastos</span></div></section><section class="card">${cardHead('En qué gastas','Distribución de gastos del mes')}${categoryDonut(monthTx(m,'main'))}</section></div><section class="card recent-card">${cardHead('Últimos movimientos','Actividad de tu cuenta principal',`<button class="btn small" data-go="transactions">Ver todos →</button>`)}${txTable(recent)}</section><div class="note">🔒 <b>Privacidad:</b> en el inicio solo mostramos Principal. Tus ahorros e inversiones están en Patrimonio y no se incluyen en este resumen.</div>`}
function renderTransactions(){let list=data.transactions.slice();if(filterMonth)list=list.filter(t=>monthKey(t.date)===filterMonth);if(filterType)list=list.filter(t=>t.type===filterType);if(filterText)list=list.filter(t=>(t.merchant+' '+t.category+' '+(t.description||'')).toLowerCase().includes(filterText.toLowerCase()));return `${head('Movimientos','Todos tus ingresos, gastos, transferencias y reembolsos.',`<button class="btn primary" data-action="add-expense">＋ Añadir</button>`)}<div class="card"><div class="toolbar"><input id="txSearch" placeholder="Buscar comercio o categoría…" value="${esc(filterText)}"><input id="txMonth" type="month" value="${esc(filterMonth)}"><select id="txType"><option value="">Todos los tipos</option><option value="expense" ${filterType==='expense'?'selected':''}>Gastos</option><option value="income" ${filterType==='income'?'selected':''}>Ingresos</option><option value="transfer" ${filterType==='transfer'?'selected':''}>Transferencias</option><option value="refund" ${filterType==='refund'?'selected':''}>Reembolsos</option></select><button class="btn small" id="clearFilters">Limpiar</button></div>${txTable(list)}</div>`}
function renderRecurring(){return `${head('Gastos recurrentes','Controla pagos e ingresos periódicos sin confundirlos con movimientos reales.',`<button class="btn primary" data-action="add-recurring">＋ Añadir recurrente</button>`)}<div class="card">${data.recurring.length?data.recurring.map(r=>`<div class="account-row"><div class="tx-icon">${catIcon(r.category)}</div><div class="account-info"><b>${esc(r.name)}</b><small>${esc(r.category)} · ${esc(r.frequency)} · Próximo: ${dateFmt(r.nextDate)}</small></div><div class="account-balance private">${money(r.amount)}</div><button class="btn small" data-edit-rec="${r.id}">Editar</button></div>`).join(''):`<div class="empty"><div class="big">◷</div><b>Organiza tus pagos periódicos</b><p>Añade hipoteca, suministros, suscripciones o ingresos recurrentes.</p><button class="btn primary" data-action="add-recurring">＋ Añadir recurrente</button></div>`}<p class="footnote">Los recurrentes son previsiones. No se contabilizan como gastos reales hasta que registres el movimiento correspondiente.</p></div>`}
function renderAnalytics(){const m=currentMonth(),t=totals(monthTx(m)),year=new Date().getFullYear(),yearList=data.transactions.filter(x=>x.date.startsWith(String(year))),yt=totals(yearList);return `${head('Estadísticas','Analiza cómo evoluciona tu economía a lo largo del tiempo.')}<div class="grid stats-grid"><div class="card stat-card"><div class="stat-top">Ingresos · mes</div><div class="stat-value positive private">${money(t.income)}</div></div><div class="card stat-card"><div class="stat-top">Gastos · mes</div><div class="stat-value negative private">${money(t.expense)}</div></div><div class="card stat-card"><div class="stat-top">Balance · mes</div><div class="stat-value private">${money(t.income-t.expense)}</div></div><div class="card stat-card"><div class="stat-top">Ahorro acumulado · ${year}</div><div class="stat-value private">${money(yt.income-yt.expense)}</div></div></div><div class="grid dash-grid"><section class="card">${cardHead('Ingresos y gastos','Comparativa de los últimos seis meses')}<div class="chart-wrap">${lineChart()}</div><div class="legend"><span><i class="dot" style="background:#4388c5"></i>Ingresos</span><span><i class="dot" style="background:#d46b75"></i>Gastos</span></div></section><section class="card">${cardHead('Categorías','Distribución del mes actual')}${categoryDonut(monthTx(m))}</section></div><section class="card">${cardHead('Resumen anual',String(year))}<div class="grid section-grid"><div class="mini-card"><div class="stat-icon">↗</div><div><b class="positive private">${money(yt.income)}</b><small>Ingresos registrados</small></div></div><div class="mini-card"><div class="stat-icon">↘</div><div><b class="negative private">${money(yt.expense)}</b><small>Gastos registrados</small></div></div><div class="mini-card"><div class="stat-icon">✧</div><div><b class="private">${money(yt.income-yt.expense)}</b><small>Balance del año</small></div></div></div></section>`}
function renderBudgets(){const m=currentMonth(),expenses=allExpenses(monthTx(m));return `${head('Presupuestos','Define límites mensuales y controla cuánto llevas gastado.',`<button class="btn primary" data-action="add-budget">＋ Crear presupuesto</button>`)}<section class="card">${data.budgets.length?data.budgets.map(b=>{const spent=expenses.filter(t=>t.category===b.category).reduce((s,t)=>s+num(t.amount),0),pct=b.limit?spent/b.limit*100:0;return `<div class="budget-row"><div><b>${catIcon(b.category)} ${esc(b.category)}</b><div class="tx-sub">${money(spent)} de ${money(b.limit)}</div></div><div class="progress ${pct>=100?'over':pct>=80?'warn':''}"><span style="width:${Math.min(100,pct)}%"></span></div><div style="text-align:right"><b>${Math.round(pct)}%</b><div class="tx-sub">${money(Math.max(0,b.limit-spent))} restante</div><button class="btn small" data-del-budget="${b.id}">Eliminar</button></div></div>`}).join(''):`<div class="empty"><div class="big">◉</div><b>Empieza a poner límites a tus gastos</b><p>Crea presupuestos por categoría para tener más control.</p><button class="btn primary" data-action="add-budget">＋ Crear presupuesto</button></div>`}<p class="footnote">El seguimiento se calcula con los gastos registrados en el mes actual.</p></section>`}
function renderGoals(){return `${head('Objetivos de ahorro','Convierte tus planes en objetivos medibles.',`<button class="btn primary" data-action="add-goal">＋ Nuevo objetivo</button>`)}<div class="grid section-grid">${data.goals.length?data.goals.map(g=>{const pct=g.target?Math.min(100,g.saved/g.target*100):0;return `<section class="card"><div class="card-head"><div><h3>${esc(g.name)}</h3><p>${g.deadline?'Objetivo: '+dateFmt(g.deadline):'Sin fecha límite'}</p></div><span class="stat-icon">◎</span></div><div class="stat-value private">${money(g.saved)} <span class="muted" style="font-size:13px">/ ${money(g.target)}</span></div><div class="progress" style="margin:13px 0 8px"><span style="width:${pct}%"></span></div><div class="stat-foot">${Math.round(pct)}% completado · Faltan ${money(Math.max(0,g.target-g.saved))}</div><div style="display:flex;gap:7px;margin-top:15px"><button class="btn small soft" data-add-goal="${g.id}">＋ Añadir ahorro</button><button class="btn small" data-edit-goal="${g.id}">Editar</button></div></section>`}).join(''):`<section class="card" style="grid-column:1/-1"><div class="empty"><div class="big">◎</div><b>¿Para qué estás ahorrando?</b><p>Crea objetivos como fondo de emergencia, viajes o entrada de vivienda.</p><button class="btn primary" data-action="add-goal">＋ Crear objetivo</button></div></section>`}</div>`}
function renderWealth(){const net=data.accounts.reduce((s,a)=>s+accountBalance(a.id),0);return `${head('Patrimonio','Consulta tus cuentas, ahorros e inversiones por separado. Esta información no aparece en Inicio.')}<section class="card wealth-total"><div class="eyebrow">Patrimonio neto estimado</div><div class="stat-value private">${money(net)}</div><div class="muted">Suma de los saldos registrados de tus cuentas y activos</div></section><div class="grid section-grid" style="margin-top:17px"><section class="card">${cardHead('Cuentas y activos','Actualiza los importes manualmente')}<div>${data.accounts.map(a=>`<div class="account-row"><div class="account-logo">${a.kind==='bank'?'B':a.kind==='savings'?'M':'↗'}</div><div class="account-info"><b>${esc(a.name)}</b><small>${a.kind==='bank'?'Cuenta principal':a.kind==='savings'?'Cuenta remunerada':'Capital invertido · actualización manual'}</small></div><div class="account-balance private">${money(accountBalance(a.id))}</div><button class="btn small" data-edit-account="${a.id}">Editar</button></div>`).join('')}</div><p class="footnote">Las inversiones se registran por el capital que decidas introducir. No consultamos cotizaciones ni calculamos rentabilidad automática.</p></section><section class="card">${cardHead('Composición del patrimonio','Distribución por cuenta')}<div style="display:grid;gap:15px">${data.accounts.map(a=>{const v=accountBalance(a.id),p=net>0?Math.max(0,v/net*100):0;return `<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px"><b>${esc(a.name)}</b><span class="private">${money(v)}</span></div><div class="progress"><span style="width:${Math.min(100,p)}%"></span></div></div>`}).join('')}</div><div class="note" style="margin-top:18px">Las transferencias entre tus propias cuentas no se consideran ingresos ni gastos, pero sí modifican el saldo de cada cuenta.</div></section></div><section class="card" style="margin-top:17px">${cardHead('Movimientos entre cuentas','No alteran tus ingresos ni tus gastos',`<button class="btn small" data-action="add-transfer">＋ Nueva transferencia</button>`)}${txTable(data.transactions.filter(t=>t.type==='transfer'))}</section>`}
function renderInsights(){const m=currentMonth(),t=totals(monthTx(m)),prev=new Date();prev.setMonth(prev.getMonth()-1);const pm=prev.toISOString().slice(0,7),pt=totals(monthTx(pm));const diff=t.expense-pt.expense;const cats={};allExpenses(monthTx(m)).forEach(x=>cats[x.category]=(cats[x.category]||0)+num(x.amount));const top=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];const savings=t.income-t.expense;let items=[];if(!data.transactions.length)items.push(['💡','Empieza registrando tus movimientos','Cuando tengas datos, GastosLAB podrá identificar tendencias y patrones de gasto.']);else{items.push(['📊','Balance del mes',`Has registrado ${money(t.income)} de ingresos y ${money(t.expense)} de gastos. El balance es ${money(savings)}.`]);if(pt.expense>0)items.push([diff>0?'↗':'↘','Comparativa de gastos',`Tus gastos están ${diff>=0?'por encima':'por debajo'} del mes anterior en ${money(Math.abs(diff))}.`]);if(top)items.push(['🎯','Categoría con mayor gasto',`${top[0]} concentra ${money(top[1])} de tus gastos de este mes.`]);if(savings<0)items.push(['⚠️','Gastos superiores a ingresos','Este mes has registrado más gastos que ingresos. Revisa las categorías y los movimientos.']);else items.push(['🌱','Ahorro registrado',`Tu diferencia entre ingresos y gastos es ${money(savings)} este mes.`])}return `${head('Análisis inteligente','Conclusiones calculadas a partir de tus movimientos. Sin enviar tus datos a ningún servicio externo.')}<div class="card">${items.map(x=>`<div class="insight"><div class="i">${x[0]}</div><div><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join('')}<p class="footnote">Los análisis son reglas estadísticas locales y descriptivas; no constituyen asesoramiento financiero.</p></div>`}
function renderSettings(){return `${head('Configuración','Personaliza GastosLAB y gestiona tus datos.')}<section class="card category-settings" style="margin-bottom:17px">${cardHead('Mis categorías','Añade, renombra, cambia el icono o elimina categorías de gastos.',`<button class="btn primary small" id="addCategoryBtn">＋ Añadir categoría</button>`)}<div class="category-manage-list">${categories.map(([name,icon])=>`<div class="category-manage-row"><span class="category-manage-icon">${icon}</span><b>${esc(name)}</b><select class="select-mini category-icon-select" data-category-icon="${esc(name)}" aria-label="Icono de ${esc(name)}">${categoryIcons.map(i=>`<option value="${i}" ${i===icon?'selected':''}>${i}</option>`).join('')}</select><button class="btn small" data-rename-category="${esc(name)}">Renombrar</button><button class="btn danger small" data-delete-category="${esc(name)}">Eliminar</button></div>`).join('')}</div><p class="footnote">Las categorías se guardan en este dispositivo y también aparecen en el formulario rápido del atajo.</p></section><div class="grid section-grid"><section class="card">${cardHead('Privacidad y visualización')}<div class="setting-row"><div><b>Ocultar importes</b><p>Difumina los importes en todas las secciones.</p></div><input type="checkbox" class="switch" id="privacySetting" ${data.settings.privacy?'checked':''}></div><div class="setting-row"><div><b>Moneda</b><p>Moneda utilizada para mostrar los importes.</p></div><select id="currencySetting" class="select-mini"><option value="EUR">EUR · Euro</option></select></div></section><section class="card">${cardHead('Copias de seguridad','Copia automática diaria local y exportación manual.')}<button class="btn primary" style="width:100%;margin-bottom:9px" id="exportBtn">↓ Exportar copia JSON</button><label class="btn" style="width:100%;margin-bottom:9px;cursor:pointer">↑ Importar copia JSON<input id="importFile" type="file" accept="application/json,.json" hidden></label><p class="footnote">Se function render(){const views={home:renderHome,transactions:renderTransactions,recurring:renderRecurring,analytics:renderAnalytics,budgets:renderBudgets,goals:renderGoals,wealth:renderWealth,insights:renderInsights,settings:renderSettings};$('#view').innerHTML=(views[page]||renderHome)();document.body.classList.toggle('privacy',!!data.settings.privacy)}

function openTx(type='expense',t=null,source=''){editingId=t?.id||null;selectedCategory=t?.category||categories[0]?.[0]||'Otros';const current=t?.type||type;const incomeKinds=['Sueldo','Bizum recibido','Transferencia recibida','Intereses','Venta','Otros ingresos'];const expenseKinds=categories.map(c=>c[0]);
const incomeMode=current==='income',transferMode=current==='transfer',refundMode=current==='refund';const kindOptions=(incomeMode?incomeKinds:expenseKinds).map(x=>`<option ${((t?.category|| (incomeMode?'Sueldo':(categories[0]?.[0]||'Otros')))===x)?'selected':''}>${x}</option>`).join('');

ect></div><div class="field span2"><label for="txDescription">Descripción (opcional)</label><textarea id="txDescription" placeholder="Añade algún detalle si lo necesitas…">${esc(t?.description||'')}</textarea></div></div>`;

$$('[data-txtype]').forEach(b=>b.onclick=()=>{$$('[data-txtype]').forEach(x=>x.classList.toggle('active',x===b));txType=b.dataset.txtype;refreshKind()});refreshKind();$('#cancelModal').onclick=closeModal;$('#saveTx').onclick=()=>{const amount=num($('#txAmount').value),date=$('#txDate').value,accountId=$('#txAccount').value,toAccountId=$('#txToAccount')?.value;if(!(amount>0)||!date){toast('Introduce un importe y una fecha válidos.');return}if(txType==='transfer'&&accountId===toAccountId){toast('Elige dos cuentas diferentes.');return}const obj={id:editingId||uid(),type:txType,amount,date,accountId,merchant:$('#txMerchant').value.trim(),category:txType==='transfer'?'Transferencia':$('#txCategory').value,method:$('#txMethod')?.value||'',description:$('#txDescription').value.trim(),toAccountId:txType==='transfer'?toAccountId:null};if(editingId){const i=data.transactions.findIndex(x=>x.id===editingId);data.transactions[i]=obj}else data.transactions.push(obj);save();closeModal();render();toast('Movimiento guardado')};if(t)$('#deleteTx').onclick=()=>{if(confirm('¿Eliminar este movimiento?')){data.transactions=data.transactions.filter(x=>x.id!==t.id);save();closeModal();render();toast('Movimiento eliminado')}}}
function openRecurring(r=null){const body=`<div class="form-grid">${field('Nombre','rName',r?.name||'','text','placeholder="Ej. Gimnasio, electricidad…" required')}${field('Importe (€)','rAmount',r?.amount||'','number','step="0.01" min="0.01" required')}<div class="field"><label for="rType">Tipo</label><select id="rType"><option value="expense" ${r?.type!=='income'?'selected':''}>Gasto</option><option value="income" ${r?.type==='income'?'selected':''}>Ingreso</option></select></div><div class="field"><label for="rFreq">Frecuencia</label><select id="rFreq">${['Mensual','Trimestral','Semestral','Anual','Semanal'].map(x=>`<option ${r?.frequency===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="rCat">Categoría</label><select id="rCat">${categoryOptions(r?.category||'Hogar')}</select></div>${field('Próxima fecha','rDate',r?.nextDate||new Date().toISOString().slice(0,10),'date')}</div>`;openModal(r?'Editar recurrente':'Nuevo recurrente',body,`<button class="btn" id="cancelModal">Cancelar</button><button class="btn primary" id="saveRecurring">Guardar</button>`);$('#cancelModal').onclick=closeModal;$('#saveRecurring').onclick=()=>{const o={id:r?.id||uid(),name:$('#rName').value.trim(),amount:num($('#rAmount').value),type:$('#rType').value,frequency:$('#rFreq').value,category:$('#rCat').value,nextDate:$('#rDate').value};if(!o.name||o.amount<=0||!o.nextDate){toast('Completa los campos obligatorios.');return}if(r)data.recurring=data.recurring.map(x=>x.id===r.id?o:x);else data.recurring.push(o);save();closeModal();render();toast('Recurrente guardado')}}
function openBudget(){const body=`<div class="field"><label for="bCat">Categoría</label><select id="bCat">${categoryOptions('Comida')}</select></div>${field('Límite mensual (€)','bLimit','','number','min="1" step="0.01" placeholder="Ej. 250" required')}`;openModal('Crear presupuesto',body,`<button class="btn" id="cancelModal">Cancelar</button><button class="btn primary" id="saveBudget">Guardar</button>`);$('#cancelModal').onclick=closeModal;$('#saveBudget').onclick=()=>{const category=$('#bCat').value,limit=num($('#bLimit').value);if(limit<=0){toast('Introduce un límite válido.');return}if(data.budgets.some(x=>x.category===category)){toast('Ya existe un presupuesto para esta categoría.');return}data.budgets.push({id:uid(),category,limit});save();closeModal();render();toast('Presupuesto creado')}}

function renameCategory(oldName){const next=prompt('Nuevo nombre para «'+oldName+'»:',oldName);if(next===null)return;const name=next.trim();if(!name||name===oldName)return;if(categories.some(c=>c[0].toLowerCase()===name.toLowerCase())){toast('Ya existe esa categoría.');return}const cat=categories.find(c=>c[0]===oldName);if(cat)cat[0]=name;data.transactions.forEach(t=>{if(t.category===oldName)t.category=name});data.recurring.forEach(t=>{if(t.category===oldName)t.category=name});data.budgets.forEach(t=>{if(t.category===oldName)t.category=name});save();render();toast('Categoría renombrada')}
function deleteCategory(name){const alternatives=categories.filter(c=>c[0]!==name);if(!alternatives.length){toast('Debe quedar al menos una categoría.');return}const affected=data.transactions.some(t=>t.category===name)||data.recurring.some(t=>t.category===name)||data.budgets.some(t=>t.category===name);let replacement='';if(affected){const options=alternatives.map((c,i)=>`${i+1}. ${c[0]}`).join('\n');const answer=prompt(`La categoría «${name}» tiene movimientos, recurrentes o presupuestos asociados. Escribe el número de la categoría a la que quieres reasignarlos:\n${options}`,'1');if(answer===null)return;replacement=alternatives[Number(answer)-1]?.[0];if(!replacement){toast('Selección no válida; no se ha eliminado.');return}}if(!confirm(`¿Eliminar la categoría «${name}»${replacement?' y reasignar sus elementos a «'+replacement+'»':''}?`))return;if(replacement){[data.transactions,data.recurring,data.budgets].forEach(list=>list.forEach(t=>{if(t.category===name)t.category=replacement}))}categories=categories.filter(c=>c[0]!==name);save();render();toast('Categoría eliminada')}
function importShortcutInbox(file){
  const reader=new FileReader();reader.onload=()=>{
    try{
      const lines=String(reader.result||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
      if(!lines.length)throw Error('El archivo está vacío.');
      const existing=new Set(data.transactions.map(t=>String(t.id)));
      let added=0,skipped=0;
      for(const line of lines){
        let item;try{item=JSON.parse(line)}catch(_){skipped++;continue}
        const amount=Number(item.amount);
        if(!item||item.type!=='expense'||!(amount>0)||!/^\d{4}-\d{2}-\d{2}$/.test(String(item.date||''))||!String(item.merchant||'').trim()){skipped++;continue}
        const id=String(item.id||('icloud-'+uid()));if(existing.has(id)){skipped++;continue}
        const category=String(item.category||'Otros');
        if(!categories.some(c=>c[0]===category))categories.push([category,'📦']);
        data.transactions.push({id,type:'expense',amount,date:item.date,merchant:String(item.merchant).trim().slice(0,120),category,accountId:'main',method:String(item.method||'Tarjeta').slice(0,40),description:String(item.description||'Importado desde Atajos').slice(0,240),source:'icloud-shortcut'});
        existing.add(id);added++;
      }
      if(added){save();backupNow('icloud-shortcut-import',true);render();}
      const status=$('#inboxStatus');if(status)status.textContent=`Importados ${added} gastos. ${skipped} omitidos (duplicados o datos no válidos).`;
      toast(`Bandeja importada: ${added} gastos nuevos`);
    }catch(e){toast('No se pudo importar la bandeja: '+e.message)}
    finally{const input=$('#inboxFile');if(input)input.value=''}
  };reader.readAsText(file);
}
function exportData(){const blob=new Blob([JSON.stringify({...data,exported:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`gastoslab-copia-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);toast('Copia descargada')}
function importData(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.version!==1||!Array.isArray(d.transactions)||!Array.isArray(d.accounts))throw Error('Formato no reconocido');if(!confirm('¿Quieres sustituir los datos actuales por esta copia?'))return;data={...blank(),...d};if(Array.isArray(data.settings.categories)&&data.settings.categories.length)categories=structuredClone(data.settings.categories);save();setPage('home');toast('Copia restaurada')}catch(e){toast('No se pudo importar: '+e.message)}};r.readAsText(file)}
function action(a){if(a==='add-expense')openTx('expense',null,new URLSearchParams(location.search).get('source')||'');if(a==='add-income')openTx('income');if(a==='add-transfer')openTx('transfer');if(a==='add-recurring')openRecurring();if(a==='add-budget')openBudget();if(a==='add-goal')openGoal()}
function handleClick(e){const b=e.target.closest('button');if(!b)return;if(b.dataset.page){setPage(b.dataset.page);return}if(b.dataset.action){action(b.dataset.action);return}if(b.dataset.go){setPage(b.dataset.go);return}if(b.dataset.editTx){const t=data.transactions.find(x=>x.id===b.dataset.editTx);if(t)openTx(t.type,t);return}if(b.dataset.editRec){openRecurring(data.recurring.find(x=>x.id===b.dataset.editRec));return}if(b.dataset.delBudget){data.budgets=data.budgets.filter(x=>x.id!==b.dataset.delBudget);save();render();return}if(b.dataset.editGoal){openGoal(data.goals.find(x=>x.id===b.dataset.editGoal));return}if(b.dataset.addGoal){const g=data.goals.find(x=>x.id===b.dataset.addGoal);const v=prompt('¿Cuánto quieres añadir al ahorro? (€)','50');if(v!==null&&num(v)>0){g.saved+=num(v);save();render();toast('Ahorro actualizado')}return}if(b.dataset.editAccount){openAccount(b.dataset.editAccount);return}if(b.dataset.renameCategory){renameCategory(b.dataset.renameCategory);return}if(b.dataset.deleteCategory){deleteCategory(b.dataset.deleteCategory);return}}
$('#sideNav').addEventListener('click',handleClick);$('#mobileNav').addEventListener('click',handleClick);$('#view').addEventListener('click',handleClick);$('#modalClose').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('#privacyToggle').onclick=()=>{data.settings.privacy=!data.settings.privacy;save();render();toast(data.settings.privacy?'Importes ocultos':'Importes visibles')};$('#settingsShortcut').onclick=()=>setPage('settings');
$('#view').addEventListener('input',e=>{if(e.target.id==='txSearch'){filterText=e.target.value;const pos=e.target.selectionStart;render();const x=$('#txSearch');x.focus();x.setSelectionRange(pos,pos)}});$('#view').addEventListener('change',e=>{if(e.target.id==='txMonth'){filterMonth=e.target.value;render()}if(e.target.id==='txType'){filterType=e.target.value;render()}if(e.target.id==='privacySetting'){data.settings.privacy=e.target.checked;save();render()}if(e.target.id==='currencySetting'){data.settings.currency=e.target.value;save()}if(e.target.matches('[data-category-icon]')){const name=e.target.dataset.categoryIcon,cat=categories.find(c=>c[0]===name);if(cat){cat[1]=e.target.value;save();render()}}if(e.target.id==='importFile'&&e.target.files[0])importData(e.target.files[0]);if(e.target.id==='inboxFile'&&e.target.files[0])importShortcutInbox(e.target.files[0])});$('#view').addEventListener('click',e=>{if(e.target.id==='clearFilters'){filterText='';filterMonth='';filterType='';render() }if(e.target.id==='exportBtn')exportData();if(e.target.id==='restoreLocalBtn')restoreLocalBackup();if(e.target.id==='addCategoryBtn')openCategoryEditor();if(e.target.id==='clearDemoBtn'&&confirm('Se eliminarán los movimientos de ejemplo. Después introducirás los saldos reales de tus cuentas. ¿Continuar?')){data=blank();save();openBalanceSetup()}if(e.target.id==='resetBtn'&&confirm('Esto eliminará los datos actuales y abrirá la configuración inicial de cuentas. ¿Continuar?')){data=blank();save();setPage('home');openBalanceSetup()}});
// Formulario rápido del atajo: interfaz independiente, breve y visual.
const params=new URLSearchParams(location.search);
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function renderShortcutForm(){
  const source=params.get('source')||'shortcut';
  const cats=categories;
  document.body.classList.add('shortcut-mode');
  $('#app').style.display='none';$('#modalBackdrop').style.display='none';$('#toast').style.display='none';
  const shell=document.createElement('main');shell.id='shortcutScreen';shell.innerHTML=`
    <header class="quick-top"><button type="button" class="quick-back" id="quickBack" aria-label="Volver">‹</button><div class="quick-brand"><img src="icons/icon-192.png" alt=""><span>GastosLAB</span></div><span class="quick-tag">NUEVO GASTO</span></header>
    <section class="quick-card">
      <div class="quick-intro"><div class="quick-eyebrow">REGISTRO RÁPIDO</div><h1>¿Cuánto has gastado?</h1><p>Un momento y listo. Tus datos se quedan en este dispositivo.</p></div>
      <label class="quick-amount-label" for="quickAmount">IMPORTE</label><div class="quick-amount-wrap"><input id="quickAmount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0,00" autocomplete="off"><span>€</span></div>
      <label class="quick-label" for="quickMerchant">¿Dónde has pagado?</label><input class="quick-input" id="quickMerchant" type="text" placeholder="Ej. supermercado, cafetería…" maxlength="70" autocomplete="off">
      <div class="quick-label-row"><label class="quick-label">Categoría</label><span class="quick-hint">Elige una</span></div>
      <div class="quick-categories" id="quickCategories">${cats.map(([name,emoji],i)=>`<button type="button" class="quick-category ${i===0?'selected':''}" data-category="${esc(name)}"><span>${emoji}</span><small>${esc(name)}</small></button>`).join('')}</div>
      <details class="quick-details"><summary> añadir descripción (opcional)</summary><textarea id="quickDescription" rows="2" maxlength="180" placeholder="Algún detalle que quieras recordar…"></textarea></details>
      <div class="quick-meta"><span class="quick-meta-icon">▣</span><span>Pago con tarjeta</span><span class="quick-meta-date">Hoy · ${new Date().toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</span></div>
      <button type="button" class="quick-save" id="quickSave">Guardar gasto <span>→</span></button>
      <p class="quick-secure">🔒 Registro privado · Sin conexión bancaria</p>
      <div class="quick-error" id="quickError" role="alert"></div>
    </section>`;
  document.body.appendChild(shell);
  let chosen=cats[0]?.[0]||'Otros';
  $('#quickCategories').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;chosen=b.dataset.category;$$('#quickCategories [data-category]').forEach(x=>x.classList.toggle('selected',x===b))});
  $('#quickBack').onclick=()=>{location.href=location.pathname};
  $('#quickSave').onclick=()=>{
    const amount=num($('#quickAmount').value),merchant=$('#quickMerchant').value.trim(),error=$('#quickError');
    if(!(amount>0)){error.textContent='Introduce un importe válido.';$('#quickAmount').focus();return}
    if(!merchant){error.textContent='Indica dónde has pagado.';$('#quickMerchant').focus();return}
    const tx={id:uid(),type:'expense',amount,date:localDate(),merchant,category:chosen,accountId:'main',method:'Tarjeta',description:$('#quickDescription').value.trim(),source:'shortcut'};
    data.transactions.push(tx);save();backupNow('after-shortcut-expense',true);
    shell.innerHTML=`<section class="quick-success"><div class="quick-success-icon">✓</div><div class="quick-eyebrow">GASTO REGISTRADO</div><h1>¡Listo!</h1><p>${esc(merchant)} · ${money(amount)}</p><button type="button" class="quick-save" id="quickDone">Volver a GastosLAB <span>→</span></button><button type="button" class="quick-again" id="quickAgain">Registrar otro gasto</button></section>`;
    $('#quickDone').onclick=()=>{location.href=location.pathname};
    $('#quickAgain').onclick=()=>{shell.remove();renderShortcutForm()};
  };
}
if(params.get('action')==='add-expense'){setTimeout(()=>{if(window.gastoslabAuthorized)renderShortcutForm()},0)}

function backupNow(reason='daily',force=false){try{const raw=localStorage.getItem(KEY);if(!raw)return;const list=JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]'),day=new Date().toISOString().slice(0,10);if(!force&&list.some(x=>x.day===day))return;list.push({day,createdAt:new Date().toISOString(),reason,data:JSON.parse(raw)});while(list.length>14)list.shift();localStorage.setItem(BACKUP_KEY,JSON.stringify(list));}catch(e){console.warn('No se pudo crear la copia local',e)}}
function checkDailyBackup(){const today=new Date().toISOString().slice(0,10),list=JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]');if(!list.some(x=>x.day===today))backupNow('daily-or-next-open');const now=new Date(),next=new Date(now);next.setHours(24,0,0,0);setTimeout(()=>{backupNow('midnight',true);checkDailyBackup()},Math.max(1000,next-now+250))}
function restoreLocalBackup(){const list=JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]');if(!list.length){toast('Todavía no hay copias locales.');return}const options=list.slice().reverse().map((b,i)=>`${i+1}. ${b.day} · ${new Date(b.createdAt).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}`).join('\n');const pick=prompt('Elige el número de la copia que quieres restaurar:\n'+options,'1');if(pick===null)return;const item=list.slice().reverse()[Number(pick)-1];if(!item){toast('Selección no válida.');return}if(!confirm('Se sustituirán los datos actuales por la copia del '+item.day+'. ¿Continuar?'))return;data={...blank(),...item.data};if(Array.isArray(data.settings.categories)&&data.settings.categories.length)categories=structuredClone(data.settings.categories);save();setPage('home');toast('Copia local restaurada')}
function openBalanceSetup(){const body=`<p class="muted" style="font-size:13px;margin-top:0">Introduce el saldo que tienes actualmente en cada cuenta. Estos importes serán tu punto de partida; los movimientos que registres después actualizarán los saldos automáticamente.</p><div class="field"><label for="initialMain">Cuenta principal (€)</label><input id="initialMain" type="number" step="0.01" value="0"></div><div class="field"><label for="initialSavings">Ahorros (€)</label><input id="initialSavings" type="number" step="0.01" value="0"></div><div class="field"><label for="initialInvestments">Inversiones · capital aportado (€)</label><input id="initialInvestments" type="number" step="0.01" value="0"></div><p class="footnote">En inversiones puedes introducir el capital que has invertido. No hace falta actualizar ganancias o pérdidas.</p>`;openModal('Configura tus saldos iniciales',body,'<button class="btn primary" id="saveInitialBalances">Guardar saldos y empezar</button>');$('#saveInitialBalances').onclick=()=>{data.accounts.find(a=>a.id==='main').balance=num($('#initialMain').value);data.accounts.find(a=>a.id==='savings').balance=num($('#initialSavings').value);data.accounts.find(a=>a.id==='investments').balance=num($('#initialInvestments').value);data.settings.setupComplete=true;data.settings.demo=false;data.settings.openingDate=new Date().toISOString().slice(0,10);save();closeModal();render();toast('Cuentas configuradas')};}

const ACCESS_KEY='gastoslab-access-token-v1';
async function gateApp(){
  const api=String(window.GASTOSLAB_ACCESS_API||'').replace(/\/$/,'');
  const shell=document.createElement('div');shell.id='accessGate';shell.style.cssText='position:fixed;inset:0;z-index:99999;background:#f3f7fc;display:grid;place-items:center;padding:20px;font-family:system-ui;color:#172b43;overflow:auto';
  document.body.appendChild(shell);$('#app').style.display='none';
  const showPreview=()=>{
    // The public preview always uses fictitious sample data; never expose this browser's saved finance data.
    data=demoData();categories=structuredClone(defaultCategories);
    $('#app').style.display='';$('#modalBackdrop').style.display='none';
    document.body.classList.add('demo-preview');
    $('#sideNav').style.display='none';$('#mobileNav').style.display='none';$('#settingsShortcut').style.display='none';$('#privacyToggle').style.display='none';
    render();
    shell.innerHTML=`<section style="width:min(440px,100%);background:white;border:1px solid #e3ebf4;border-radius:20px;padding:20px;box-shadow:0 12px 34px #173b6310"><div style="font-size:25px">🔒</div><b style="display:block;color:#123b64;font-size:16px;margin:5px 0">Vista de demostración</b><p style="font-size:12px;color:#71839a;margin:0 0 13px">Estás viendo únicamente datos ficticios. Para borrar el ejemplo y empezar a utilizar GastosLAB necesitas una invitación personal.</p><label style="display:block;font-size:11px;font-weight:750;margin:12px 0 6px">Código de invitación</label><input id="inviteCode" autocomplete="one-time-code" placeholder="GL-XXXX-XXXX" style="width:100%;padding:13px;border:1px solid #dce6f0;border-radius:10px;font-size:17px;letter-spacing:1px;text-transform:uppercase"><button id="gateSubmit" style="width:100%;padding:13px;border:0;border-radius:11px;background:#2463a6;color:white;font-weight:800;margin-top:10px">Autorizar este dispositivo</button><p id="gateError" style="color:#c34e5b;font-size:12px;margin:8px 0 0"></p><p style="font-size:10px;color:#8a9aab;margin:9px 0 0">Cada invitación se puede utilizar una sola vez y autoriza un único dispositivo. Los datos financieros se guardan localmente.</p></section>`;
    shell.style.position='fixed';shell.style.inset='auto 16px 16px auto';shell.style.width='min(440px,calc(100% - 32px))';shell.style.zIndex='99999';shell.style.padding='0';shell.style.background='transparent';shell.style.display='block';
    $('#gateSubmit').onclick=activate;
  };
  async function activate(){
    const code=$('#inviteCode').value.trim().toUpperCase();if(!code){$('#gateError').textContent='Introduce tu código.';return}
    if(!api||api.includes('REEMPLAZAR')){$('#gateError').textContent='El servicio de autorizaciones aún no está configurado.';return}
    $('#gateSubmit').disabled=true;$('#gateError').textContent='Validando invitación…';
    try{const r=await fetch(api+'/api/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,label:/iPhone|iPad/i.test(navigator.userAgent)?'Dispositivo Apple':'Navegador autorizado'})});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo activar el dispositivo.');localStorage.setItem(ACCESS_KEY,d.token);unlock()}catch(e){$('#gateError').textContent=e.message;$('#gateSubmit').disabled=false}
  }
  function unlock(){
    window.gastoslabAuthorized=true;document.body.classList.remove('demo-preview');shell.remove();
    $('#sideNav').style.display='';$('#mobileNav').style.display='';$('#settingsShortcut').style.display='';$('#privacyToggle').style.display='';
    data=load();categories=Array.isArray(data.settings.categories)?structuredClone(data.settings.categories):structuredClone(defaultCategories);
    $('#app').style.display='';$('#modalBackdrop').style.display='';
    if(params.get('action')==='add-expense')renderShortcutForm();else render();checkDailyBackup();
  }
  if(api&&!api.includes('REEMPLAZAR')){
    const token=localStorage.getItem(ACCESS_KEY);
    if(token){
      try{
        const r=await fetch(api+'/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),signal:AbortSignal.timeout(7000)});
        if(r.ok){const result=await r.json();if(result.valid){unlock();return}if(result.valid===false){localStorage.removeItem(ACCESS_KEY)}else{unlock();return}}
        else if(r.status===401||r.status===403){localStorage.removeItem(ACCESS_KEY)}
        else{window.gastoslabOfflineAuthorization=true;unlock();return}
      }catch(e){window.gastoslabOfflineAuthorization=true;unlock();return}
    }
  }
  showPreview();
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
gateApp();
})();
