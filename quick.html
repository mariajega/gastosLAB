<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b64"><meta name="robots" content="noindex,nofollow">
<title>GastosLAB · Registro rápido</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b43;background:#f3f7fc}*{box-sizing:border-box}body{margin:0;padding:20px;min-height:100vh;display:grid;place-items:center}.card{width:min(100%,460px);background:#fff;border:1px solid #e3ebf4;border-radius:22px;padding:23px;box-shadow:0 14px 38px #173b6312}.brand{display:flex;align-items:center;gap:10px;color:#123b64;font-weight:800;font-size:18px}.brand img{width:38px;height:38px;border-radius:11px}.eyebrow{font-size:10px;letter-spacing:1.2px;font-weight:800;color:#5794cf;margin-top:23px}h1{font-size:25px;letter-spacing:-.6px;margin:5px 0}p{color:#71839a;font-size:13px;line-height:1.5;margin:5px 0 20px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:11px;font-weight:750;color:#53677f}.field input,.field select,.field textarea{width:100%;border:1px solid #dce6f0;border-radius:11px;padding:13px;background:#fff;color:#172b43;font:inherit;font-size:15px}.amount{font-size:28px!important;font-weight:800}.save{width:100%;border:0;border-radius:12px;padding:15px;background:#2463a6;color:white;font-weight:800;font-size:15px;margin-top:8px}.hint{font-size:11px;color:#71839a;text-align:center;margin-top:13px}.status{display:none;border-radius:12px;padding:13px;background:#e9f6f0;color:#176b4d;font-size:13px;margin-top:14px}.error{color:#c34e5b;font-size:12px;margin-top:10px;min-height:18px}
</style></head><body><main class="card"><div class="brand"><img src="icons/icon-192.png" alt=""> GastosLAB</div><div class="eyebrow">REGISTRO RÁPIDO</div><h1>Nuevo gasto</h1><p>Introduce el pago con tarjeta. Se generará un pequeño archivo para importar después en tu GastosLAB.</p>
<form id="expenseForm"><div class="field"><label for="amount">IMPORTE (€)</label><input class="amount" id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0,00" required></div><div class="field"><label for="merchant">COMERCIO</label><input id="merchant" maxlength="120" placeholder="Ej. supermercado, cafetería…" required></div><div class="field"><label for="date">FECHA</label><input id="date" type="date" required></div><div class="field"><label for="category">CATEGORÍA</label><input id="category" maxlength="40" value="Otros" placeholder="Ej. Comida, Transporte…"></div><div class="field"><label for="description">DESCRIPCIÓN (OPCIONAL)</label><textarea id="description" rows="2" maxlength="240" placeholder="Detalle opcional"></textarea></div><button class="save" type="submit">Guardar gasto y generar archivo →</button></form><div class="error" id="error" role="alert"></div><div class="status" id="status"></div><div class="hint">No requiere invitación ni accede a tus movimientos. El archivo se guarda mediante las opciones de iOS.</div></main>
<script>
const $=id=>document.getElementById(id);const now=new Date();$('date').value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
$('expenseForm').addEventListener('submit',async e=>{e.preventDefault();$('error').textContent='';const amount=Number($('amount').value),merchant=$('merchant').value.trim(),date=$('date').value;if(!(amount>0)||!merchant||!/^\d{4}-\d{2}-\d{2}$/.test(date)){$('error').textContent='Revisa el importe, el comercio y la fecha.';return}
const record={id:crypto.randomUUID?crypto.randomUUID():`quick-${Date.now()}-${Math.random().toString(16).slice(2)}`,type:'expense',amount,date,merchant,category:$('category').value.trim()||'Otros',method:'Tarjeta',description:$('description').value.trim(),source:'icloud-shortcut'};
const blob=new Blob([JSON.stringify(record)+'\n'],{type:'text/plain;charset=utf-8'});const filename=`GastosLAB-${date}-${record.id.slice(0,8)}.jsonl`;const file=new File([blob],filename,{type:'text/plain'});
try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Guardar gasto en iCloud Drive',text:'Guarda este archivo en iCloud Drive para importarlo después en GastosLAB.'});$('status').textContent='Archivo preparado. En la hoja de compartir, selecciona «Guardar en Archivos» y elige iCloud Drive.';}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);$('status').textContent='Archivo generado. Abre Descargas y guárdalo en iCloud Drive.';}$('status').style.display='block';}catch(err){if(err.name!=='AbortError')$('error').textContent='No se pudo generar el archivo. Inténtalo de nuevo.'}
});
</script></body></html>
