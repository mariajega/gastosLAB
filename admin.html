<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración · GastosLAB</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#172b43;font:15px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:850px;margin:40px auto;padding:0 18px}.card{background:white;border:1px solid #e3ebf4;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 25px #173b630b}h1{margin:0 0 6px;color:#123b64}p,.muted{color:#71839a;font-size:13px}.field{display:grid;gap:6px;margin:12px 0}.field input{padding:12px;border:1px solid #dce6f0;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:11px 15px;background:#2463a6;color:white;font-weight:700;cursor:pointer}.btn.danger{background:#fff0f1;color:#c34e5b}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #edf1f6;padding:12px 0}.code{font-size:22px;font-weight:800;letter-spacing:2px;background:#eff6fd;border-radius:10px;padding:14px;margin:12px 0;word-break:break-word}.status{font-size:12px;color:#71839a}.hidden{display:none}.row button{white-space:nowrap}@media(max-width:560px){.row{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><h1>GastosLAB · Administración</h1><p>Gestiona invitaciones de un solo uso y dispositivos autorizados. Esta página no accede a datos financieros.</p><section class="card"><div class="field"><label>URL del servicio Cloudflare Worker</label><input id="api" placeholder="https://tu-worker.workers.dev"></div><div class="field"><label>Clave de administración (ADMIN_KEY)</label><input id="key" type="password" autocomplete="off" placeholder="Introduce tu clave"></div><button class="btn" id="connect">Conectar</button><span class="status" id="status"></span></section><section class="card hidden" id="panel"><h2>Crear invitación</h2><p>Cada código solo puede activarse una vez y autoriza un único navegador/dispositivo.</p><button class="btn" id="create">＋ Generar código</button><div id="newCode" class="code hidden"></div><div id="lists"></div></section></main><script>
let api='',key='';const $=s=>document.querySelector(s);const req=async(path,method='GET',body)=>{const r=await fetch(api+path,{method,headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Error de conexión');return d};
$('#connect').onclick=async()=>{api=$('#api').value.trim().replace(/\/$/,'');key=$('#key').value.trim();if(!api||!key){$('#status').textContent='Introduce la URL y la clave.';return}try{await req('/api/admin/devices');$('#panel').classList.remove('hidden');$('#status').textContent='Conexión correcta.';await refresh()}catch(e){$('#status').textContent=e.message}};
$('#create').onclick=async()=>{try{const d=await req('/api/admin/invites','POST',{});$('#newCode').textContent=d.code;$('#newCode').classList.remove('hidden');await refresh()}catch(e){alert(e.message)}};
async function refresh(){const [i,d]=await Promise.all([req('/api/admin/invites'),req('/api/admin/devices')]);let html='<h2>Invitaciones</h2>';html+=i.invites.map(x=>`<div class="row"><div><b>${x.used_at?'Utilizada':x.revoked_at?'Revocada':'Disponible'}</b><div class="status">Creada: ${new Date(x.created_at).toLocaleString('es-ES')}</div></div>${!x.used_at&&!x.revoked_at?`<button class="btn danger" data-invite="${x.id}">Revocar</button>`:''}</div>`).join('')||'<p>No hay invitaciones.</p>';html+='<h2>Dispositivos autorizados</h2>';html+=d.devices.map(x=>`<div class="row"><div><b>${esc(x.device_name)}</b><div class="status">Alta: ${new Date(x.created_at).toLocaleString('es-ES')} · Última actividad: ${(x.last_seen_at?new Date(x.last_seen_at).toLocaleString('es-ES'):'Sin actividad')} · ${x.revoked_at?'Revocado':'Activo'}</div></div>${!x.revoked_at?`<button class="btn danger" data-device="${x.id}">Revocar acceso</button>`:''}</div>`).join('')||'<p>No hay dispositivos.</p>';$('#lists').innerHTML=html;$('#lists').querySelectorAll('[data-invite]').forEach(b=>b.onclick=async()=>{await req('/api/admin/invites/'+b.dataset.invite+'/revoke','POST',{});refresh()});$('#lists').querySelectorAll('[data-device]').forEach(b=>b.onclick=async()=>{if(confirm('¿Revocar este dispositivo?')){await req('/api/admin/devices/'+b.dataset.device+'/revoke','POST',{});refresh()}})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
